
<!-- ini -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cocktail Guide</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/ini.css">

    <!-- JavaScript 연결 -->
    <script src="js/ini.js" defer></script>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">COCKTAIL GUIDE</h1>
            <span class="header-label">EXPLORE YOUR TASTE</span>
        </div>
    </header>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="main-container">

        <!-- 메인 소개 영역 -->
        <section class="hero">
            <p class="eyebrow">DISCOVER YOUR DRINK</p>

            <h2>Find Your Perfect Cocktail.</h2>

            <p>
                Discover drinks that match your taste.
            </p>
        </section>


        <!-- =========================
             이름 검색 영역
        ========================== -->
        <section class="search-section">

            <label for="searchInput">
                Search Cocktails
            </label>

            <div class="search-box">

                <span class="search-icon" aria-hidden="true">
                    ⌕
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by cocktail name..."
                    autocomplete="off"
                    aria-label="칵테일 이름 검색"
                >

                <button
                    id="clearButton"
                    type="button"
                    aria-label="검색어 지우기"
                >
                    ×
                </button>

            </div>

        </section>


        <!-- =========================
             태그 필터링 영역
        ========================== -->
        <section class="tag-section">

            <div class="section-heading">

                <h3>Explore by Flavor</h3>

                <span>Multiple selection</span>

            </div>

            <div id="tagList" class="tag-list">
                <!-- JavaScript에서 태그 버튼 생성 -->
            </div>

            <button
                id="resetButton"
                class="reset-button"
                type="button"
            >
                Reset Filters
            </button>

        </section>


        <!-- =========================
             칵테일 목록 영역
        ========================== -->
        <section class="cocktail-section">

            <div class="section-heading">

                <h3>Cocktail List</h3>

                <span id="resultCount">0 cocktails</span>

            </div>


            <!-- 검색 결과 카드 -->
            <div
                id="cocktailList"
                class="cocktail-grid"
            >
                <!-- JavaScript에서 칵테일 카드 생성 -->
            </div>


            <!-- 검색 결과가 없을 때 -->
            <p
                id="noResult"
                class="no-result"
                hidden
            >
                No cocktails found.
                <br>
                Try another search or tag.
            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">
        <p>COCKTAIL GUIDE PROJECT</p>
    </footer>

</body>
</html>
